name: Android CI

on:
  push:
    branches:
      - main
      - android-core-alpha
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android 17 preview SDK
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"

          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          ANDROID_CLI="$(command -v android)"

          echo "Android CLI: $ANDROID_CLI"
          "$ANDROID_CLI" --version
          "$ANDROID_CLI" --sdk="$ANDROID_SDK_ROOT" sdk list 'platforms/android-37' --all --canary
          "$ANDROID_CLI" --sdk="$ANDROID_SDK_ROOT" sdk install --canary \
            platforms/android-37 \
            build-tools/37.0.0 \
            platform-tools

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: efficient-machine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
